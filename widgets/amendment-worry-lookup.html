<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Which Worry Did Each Amendment Answer?</title>
<style>
* { box-sizing: border-box; }
body { margin: 0; padding: 14px; font-family: "Segoe UI", Arial, sans-serif; color: #1a2340; background: #F4F6FA; font-size: 15px; line-height: 1.5; }
h1 { font-size: 19px; color: #0E1C42; margin: 0 0 4px; }
.sub { font-size: 13px; color: #6b7a99; margin: 0 0 12px; }
.grid { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
.grid button { flex: 1 1 15%; min-width: 58px; background: #fff; border: 1.5px solid #0E1C42; color: #0E1C42; border-radius: 8px; padding: 9px 4px; font-size: 14px; font-family: inherit; cursor: pointer; position: relative; }
.grid button:hover { background: #F4F6FA; }
.grid button.seen { background: #E8F6FB; }
.grid button.on { background: #0E1C42; color: #fff; }
.grid button.seen::after { content: "\2713"; position: absolute; top: 1px; right: 5px; font-size: 11px; color: #2A9D5C; }
.grid button.on.seen::after { color: #9fe0b8; }
.panel { background: #fff; border: 1px solid #D0D9E8; border-top: 4px solid #C7922C; border-radius: 8px; padding: 12px 14px; margin-bottom: 10px; min-height: 190px; }
.panel h2 { margin: 0 0 8px; font-size: 16px; color: #0E1C42; }
.lab { font-size: 11.5px; letter-spacing: .06em; text-transform: uppercase; color: #7A2048; font-weight: 700; margin: 8px 0 2px; }
.panel p { margin: 0; font-size: 14.5px; }
.prog { font-size: 12.5px; color: #6b7a99; margin-bottom: 8px; }
.done { display: none; margin-bottom: 10px; padding: 10px 14px; background: #D8F0DD; border-left: 4px solid #2A9D5C; border-radius: 4px; color: #1A6B3D; font-size: 14px; }
.done.show { display: block; }
.reset { background: transparent; border: 1px solid #C7922C; color: #C7922C; border-radius: 6px; padding: 8px 14px; font-size: 13px; font-family: inherit; cursor: pointer; }
.reset:hover { background: #FDF3E3; }
</style>
</head>
<body>
<h1>Which Worry Did Each Amendment Answer?</h1>
<p class="sub">Tap an amendment to see what it protects and the worry behind it.</p>

<div class="prog" id="prog"></div>
<div class="grid" id="grid"></div>
<div class="panel" id="panel"></div>
<div class="done" id="done">That is all ten. Notice that most of them answer a specific fear, while the last two work differently: they say how to read the whole list.</div>
<button class="reset" id="reset">Reset</button>

<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var AM = [
    { n: 'First', p: 'Religion (no established church, and free exercise of your own faith), speech, the press, peaceable assembly, and petitioning the government for a redress of grievances.',
      w: 'Anti-Federalists objected that the Constitution guaranteed no freedom of speech. Men who had fought a revolution partly over the Crown\'s disregard for such protections wanted them written down.' },
    { n: 'Second', p: 'The right of the people to keep and bear arms. The text ties the right to the security of a "well regulated Militia."',
      w: 'The sentence names its own reason: a well regulated militia is necessary to the security of a free State. How that reason relates to the right is a question you study closely later in this module.' },
    { n: 'Third', p: 'No quartering of soldiers in a private home in peacetime without the owner\'s consent.',
      w: 'A direct response to British practice in the colonies of housing soldiers in private homes.' },
    { n: 'Fourth', p: 'Protection against unreasonable searches and seizures. Warrants may issue only upon probable cause.',
      w: 'The Constitution as drafted said nothing to stop the new federal government from searching a citizen\'s home without cause.' },
    { n: 'Fifth', p: 'A grand jury for serious federal crimes, no double jeopardy, no forced self-incrimination, no loss of life, liberty, or property without due process, and just compensation when property is taken for public use.',
      w: 'It reads like a checklist of what could go wrong once a person is accused of a crime: being charged without a check, tried twice, or made to testify against himself.' },
    { n: 'Sixth', p: 'A speedy and public trial by an impartial jury, knowing the charges, confronting witnesses, calling favorable witnesses, and having a lawyer.',
      w: 'A person left to wait in jail with no hearing, tried in secret, or convicted on accusations he never gets to challenge.' },
    { n: 'Seventh', p: 'The right to a jury trial in most federal civil lawsuits.',
      w: 'Ratification critics complained that no clause guaranteed a jury trial in every case.' },
    { n: 'Eighth', p: 'No excessive bail, no excessive fines, and no cruel and unusual punishment.',
      w: 'Government power to hold and punish people with no limit on how harsh it could be.' },
    { n: 'Ninth', p: 'Listing certain rights must not be read to mean the people have no other rights.',
      w: 'Madison\'s own earlier worry, shared by Hamilton: any list of rights would be incomplete, and the unlisted rights would suffer for the omission.' },
    { n: 'Tenth', p: 'Powers the Constitution neither gives to the federal government nor forbids to the states belong to the states or to the people.',
      w: 'The enumerated-powers idea the Federalists had relied on all along: the federal government has only the powers it is actually given.' }
  ];
  var cur, seen;
  function init() { cur = 0; seen = [true, false, false, false, false, false, false, false, false, false]; draw(); }
  function draw() {
    var g = $('grid'); g.innerHTML = '';
    AM.forEach(function (a, i) {
      var b = document.createElement('button');
      b.textContent = a.n;
      b.className = (i === cur ? 'on ' : '') + (seen[i] ? 'seen' : '');
      b.addEventListener('click', function () { cur = i; seen[i] = true; draw(); });
      g.appendChild(b);
    });
    var a = AM[cur];
    $('panel').innerHTML = '<h2>The ' + a.n + ' Amendment</h2><div class="lab">What it protects</div><p></p><div class="lab">The worry behind it</div><p></p>';
    var ps = $('panel').querySelectorAll('p');
    ps[0].textContent = a.p; ps[1].textContent = a.w;
    var n = seen.filter(Boolean).length;
    $('prog').textContent = 'Explored: ' + n + ' of 10';
    $('done').className = 'done' + (n === 10 ? ' show' : '');
  }
  $('reset').addEventListener('click', init);
  init();
})();
</script>
</body>
</html>
